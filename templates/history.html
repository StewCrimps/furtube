{%extends 'base.html'%}
{%block context%}
<br>
<br>
<br>
<div class="center-row">
    <div class="col-md-3">
        <h3>Watch History:</h3>

        {% for video in videos %}
        <a href="/watch/{{ video.id }}" class="d-block text-decoration-none text-reset">
            <div class="card mb-3">
                <div class="row g-0 align-items-center">
                    <div class="col-5">
                        <div class="ratio ratio-16x9">
                            <video src="{{ url_for('static', filename='videos/' + video.filename) }}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 8px;" muted playsinline></video>
                        </div>
                    </div>
                    <div class="col-7">
                        <div class="card-body py-0">
                            <h5 class="card-title mb-1" style="font-size: 16px;">{{ video.title }}</h5>
                            <small class="text-body-light">Uploaded by {{ video.uploaded_by }} • {{ video.ext|upper }}</small>
                        </div>
                    </div>
                </div>
            </div>
        </a>
        {% else %}
        <div class="alert alert-secondary">No videos in history yet.</div>
        {% endfor %}
    </div>
</div>
{%endblock%}
