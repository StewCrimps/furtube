{%extends 'base.html'%}
{%block context%}

{{current_user}}
<br>
<br>
<div class="center-row">
    <div class="row">
        <div class="d-flex flex-nowrap overflow-x-auto gap-2 pb-2" role="tablist">
            <button type="button" class="btn btn-light text-nowrap active" id="all-tab" data-bs-toggle="tab" data-bs-target="#all" role="tab" aria-controls="all" aria-selected="true">All</button>
            <button type="button" class="btn btn-light text-nowrap" id="new-tab" data-bs-toggle="tab" data-bs-target="#new" role="tab" aria-controls="new" aria-selected="false">Newest</button>
            <button type="button" class="btn btn-light text-nowrap" id="trending-tab" data-bs-toggle="tab" data-bs-target="#trending" role="tab" aria-controls="trending" aria-selected="false">Trending</button>
        </div>

        <div class="tab-content">
            <div class="tab-pane fade show active videoblock" id="all" role="tabpanel" aria-labelledby="all-tab" style="justify-content: center;">
                <!-- all videos  -->
                <div class="big-video">
                    {%for i in videos%}
                    <a href="/watch/{{i.id}}" class="d-block text-decoration-none text-reset">
                        <div class="card mb-3" style="width: 100%;">
                            <div class="ratio ratio-16x9">
                                <img src="/static/images/preset_thumpnail.png" style="width: 100%; height: 100%; object-fit: cover; border-radius: 8px;" alt="thumpnail">
                            </div>
                            <div class="card-body px-0">
                                <h5 class="card-title mb-1" style="font-size: 26px; font-optical-sizing: auto; font-weight: 600;">{{i.title}}</h5>
                                <small class="text-body-light">100 Views • 1 Hour ago</small>
                            </div>
                        </div>
                    </a>
                    {%endfor%}
                </div>
            </div>
        </div>
    </div>
</div>

{%endblock%}
